:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f9f2df;background:#10192b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 50% 17%,#334c6c,#10192b 70%);display:grid;place-items:center}.app{width:min(100%,720px);min-height:min(100dvh,850px);padding:clamp(14px,3vw,28px);display:flex;flex-direction:column;justify-content:center;gap:14px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(25px,5vw,40px);margin:0;letter-spacing:-.05em}.eyebrow{color:#e9bb72;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:800}.pill{background:#ffffff16;border:1px solid #ffffff30;border-radius:99px;padding:10px 14px;font-size:13px;white-space:nowrap}.subtitle{margin:0;color:#b9c6d4;min-height:2em;font-size:14px}.board-wrap{width:min(100%,min(70dvh,570px));margin:auto;position:relative}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(4px,1vw,8px);padding:clamp(7px,1.4vw,13px);background:#18253c;border:2px solid #6e829646;border-radius:22px;box-shadow:0 24px 50px #05091480;aspect-ratio:1}.tile{border:1px solid #506177;background:#263650;border-radius:14px;position:relative;cursor:pointer;touch-action:manipulation;padding:0;color:#fff;transition:background .2s,transform .15s}.tile:hover{background:#354a69}.tile:active{transform:scale(.94)}.tile:focus-visible,button:focus-visible{outline:3px solid #f6c779;outline-offset:2px}.tile svg{width:100%;height:100%;display:block}.tile.lit{background:#685839;border-color:#efbf67;box-shadow:inset 0 0 18px #f3bd5480}.tile.fixed{cursor:default;background:#39435b}.tile.fixed.lit{background:#706044}.tile.source-beacon,.tile.goal-beacon{border:3px solid #ffd57d;box-shadow:0 0 0 3px #b67d3660,0 0 22px #e6aa5470;background:#423f4b}.tile.goal-beacon{border-color:#82d9ff;box-shadow:0 0 0 3px #4c9ab16b,0 0 27px #74d2ff80;background:#28475e}.tile.goal-beacon.lit{border-color:#ffde90;box-shadow:0 0 0 4px #f4cf7660,0 0 32px #ffd570}.tile.source-beacon::after,.tile.goal-beacon::after{position:absolute;bottom:3px;left:0;right:0;content:"START";font-size:clamp(7px,1.5vw,10px);font-weight:900;letter-spacing:.06em;color:#fff9d9;text-align:center;text-shadow:0 1px 3px #172337}.tile.goal-beacon::after{content:"GOAL"}.tile .icon{font-size:clamp(13px,3vw,23px);font-weight:900;fill:#fff6d7;paint-order:stroke;stroke:#172034;stroke-width:4px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}button.action{border:1px solid #ffffff38;background:#253752;color:#fdf5e8;border-radius:12px;padding:11px 18px;font:700 14px inherit;cursor:pointer;min-width:104px}.action.primary{background:#f1bf68;color:#1a2436;border-color:#ffd78b}.status{text-align:center;min-height:28px;font-weight:700;color:#efc77f}.hint{text-align:center;color:#aab9c9;font-size:12px;margin:0}.overlay{position:absolute;inset:0;background:#10192bcc;display:none;align-items:center;justify-content:center;border-radius:22px;text-align:center;padding:24px}.overlay.show{display:flex}.card{background:#21314b;border:1px solid #e4bd77;border-radius:18px;padding:28px;box-shadow:0 20px 50px #0009}.card h2{margin:0 0 8px;font-size:30px}.card p{color:#cbd7df;line-height:1.5}.card button{margin-top:9px}@media(max-height:570px){.app{gap:6px}.board-wrap{width:min(58dvh,400px)}h1{font-size:22px}.subtitle{min-height:0}}
</style></head><body><main class="app"><header><div><div class="eyebrow">A glowing path puzzle</div><h1>Join the Beacons</h1></div><div class="pill" id="levelLabel">Level 1 / 12</div></header><p class="subtitle" id="instruction">Rotate the paths to join the two beacons.</p><div class="board-wrap"><div class="board" id="board" aria-label="Path puzzle"></div><div class="overlay" id="overlay"><div class="card"><h2 id="winTitle">Brilliant!</h2><p id="winText">The beacon is glowing.</p><button class="action primary" id="nextButton">Next level</button></div></div></div><div class="status" id="status" aria-live="polite"></div><div class="controls"><button class="action" id="resetButton">Reset board</button><button class="action" id="hintButton">Show hint</button></div><p class="hint">Click or tap to rotate clockwise. Keyboard: Tab to select a tile, Enter or Space to rotate.</p></main><script>
(()=>{'use strict';const N=5,T=[1,2,4,8],opp=d=>(d+2)%4,bit=d=>T[d],dirs=[[0,-1],[1,0],[0,1],[-1,0]],board=document.getElementById('board'),overlay=document.getElementById('overlay'),status=document.getElementById('status');const paths=[[[0,2],[1,2],[2,2],[3,2],[4,2]],[[0,1],[1,1],[1,2],[2,2],[3,2],[3,3],[4,3]],[[0,3],[1,3],[1,2],[2,2],[2,1],[3,1],[4,1]],[[0,0],[1,0],[2,0],[2,1],[2,2],[3,2],[3,3],[4,3]],[[0,4],[1,4],[1,3],[2,3],[2,2],[3,2],[3,1],[4,1]],[[0,2],[1,2],[1,1],[2,1],[2,2],[3,2],[3,3],[4,3]],[[0,0],[1,0],[1,1],[2,1],[3,1],[3,2],[4,2]],[[0,4],[1,4],[2,4],[2,3],[2,2],[3,2],[3,1],[4,1]],[[0,1],[1,1],[2,1],[2,2],[1,2],[1,3],[2,3],[3,3],[4,3]],[[0,3],[1,3],[2,3],[2,2],[3,2],[3,1],[2,1],[2,0],[3,0],[4,0]],[[0,2],[1,2],[1,1],[2,1],[3,1],[3,2],[3,3],[4,3]],[[0,4],[1,4],[1,3],[2,3],[3,3],[3,2],[2,2],[2,1],[3,1],[4,1]]];let level=0,cells=[],initial=[],start=0,end=0,won=false,paused=false,hintTimeout=0,saveTimer=0;const sdk=()=>window.ytgame;function invoke(path,...args){try{let o=sdk();for(const key of path.split('.'))o=o?.[key];if(typeof o==='function')return o(...args)}catch(e){console.warn('Playables SDK:',e.message)}}function rotate(mask){return ((mask<<1)&15)|((mask>>3)&1)}function rotateTimes(mask,n){while(n-->0)mask=rotate(mask);return mask}function saved(){return {version:1,level,board:cells.map(c=>c.mask)}}function persist(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(sdk()?.IN_PLAYABLES_ENV)invoke('game.saveData',saved());else try{localStorage.setItem('lantern_paths_save',JSON.stringify(saved()))}catch{}},150)}function dir(a,b){const x=b[0]-a[0],y=b[1]-a[1];return dirs.findIndex(([dx,dy])=>dx===x&&dy===y)}function generate(idx){const path=paths[idx],seed=idx*9239+411;let state=seed;const random=()=>{state=(Math.imul(state,1664525)+1013904223)>>>0;return state/4294967296};const tiles=Array.from({length:25},(_,i)=>({mask:rotateTimes([5,3,7][Math.floor(random()*3)],Math.floor(random()*4)),solution:0,fixed:false}));for(let j=0;j<path.length;j++){let mask=0;if(j>0)mask|=bit(dir(path[j],path[j-1]));if(j<path.length-1)mask|=bit(dir(path[j],path[j+1]));const i=path[j][1]*N+path[j][0];tiles[i].solution=mask;tiles[i].mask=rotateTimes(mask,j===0||j===path.length-1?0:1+Math.floor(random()*3));tiles[i].fixed=j===0||j===path.length-1}return {tiles,start:path[0][1]*N+path[0][0],end:path.at(-1)[1]*N+path.at(-1)[0]}}function reachable(){const seen=new Set([start]),queue=[start];for(let q=0;q<queue.length;q++){const i=queue[q],x=i%N,y=Math.floor(i/N);for(let d=0;d<4;d++){let xx=x+dirs[d][0],yy=y+dirs[d][1];if(xx<0||yy<0||xx>=N||yy>=N||!(cells[i].mask&bit(d)))continue;let ni=yy*N+xx;if((cells[ni].mask&bit(opp(d)))&&!seen.has(ni)){seen.add(ni);queue.push(ni)}}}return seen}function draw(){const lit=reachable();board.replaceChildren();cells.forEach((c,i)=>{const el=document.createElement('button');el.type='button';el.className='tile'+(lit.has(i)?' lit':'')+(c.fixed?' fixed':'')+(i===start?' source-beacon':i===end?' goal-beacon':'');el.disabled=c.fixed||won||paused;el.setAttribute('aria-label',i===start?'Start beacon, fixed':i===end?'Goal beacon, fixed':`Row ${Math.floor(i/N)+1}, column ${i%N+1}, rotate path`);const lines=[];for(let d=0;d<4;d++)if(c.mask&bit(d)){let x=50+dirs[d][0]*43,y=50+dirs[d][1]*43;lines.push(`<path d="M50 50 L${x} ${y}"/>`)}const color=lit.has(i)?'#f6c56e':'#a4bdc9';el.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="none" stroke="${color}" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">${lines.join('')}</g><circle cx="50" cy="50" r="12" fill="${color}"/>${i===start||i===end?'<circle cx="50" cy="50" r="31" fill="#172337" stroke="#f6d789" stroke-width="5"/><circle cx="50" cy="50" r="19" fill="#ffcf70"/><circle cx="50" cy="50" r="9" fill="#fff9da"/>':''}</svg>`;el.addEventListener('click',()=>{if(won||paused)return;c.mask=rotate(c.mask);draw();persist();if(reachable().has(end))win()});board.append(el)})}function loadLevel(n,restored){level=n;const g=generate(n);cells=g.tiles;start=g.start;end=g.end;if(restored?.level===n&&Array.isArray(restored.board)&&restored.board.length===25)restored.board.forEach((mask,i)=>{if(!cells[i].fixed&&Number.isInteger(mask)&&mask>=0&&mask<=15)cells[i].mask=mask});initial=cells.map(c=>c.mask);won=false;overlay.classList.remove('show');document.getElementById('levelLabel').textContent=`Level ${level+1} / ${paths.length}`;status.textContent='';draw();if(reachable().has(end))win()}function win(){won=true;draw();const last=level===paths.length-1;document.getElementById('winTitle').textContent=last?'All beacons lit!':'Brilliant!';document.getElementById('winText').textContent=last?'You completed all 12 levels. Replay whenever you like.':'The beacons are joined. Ready for the next path?';document.getElementById('nextButton').textContent=last?'Play again':'Next level';overlay.classList.add('show');status.textContent='Beacons joined ✦';invoke('engagement.sendScore',{value:level+1});persist()}document.getElementById('nextButton').onclick=()=>{loadLevel(level===paths.length-1?0:level+1);persist()};document.getElementById('resetButton').onclick=()=>{cells.forEach((c,i)=>c.mask=initial[i]);won=false;overlay.classList.remove('show');status.textContent='Board reset';draw();persist()};document.getElementById('hintButton').onclick=()=>{const i=cells.findIndex(c=>c.solution&&c.mask!==c.solution&&!c.fixed);if(i<0){status.textContent='Try following the light from the start beacon';return}const el=board.children[i];el.style.outline='3px solid #f6c56e';status.textContent=`Try rotating row ${Math.floor(i/N)+1}, column ${i%N+1}`;clearTimeout(hintTimeout);hintTimeout=setTimeout(()=>{if(el.isConnected)el.style.outline=''},2000)};invoke('game.firstFrameReady');let initialized=false;async function init(){if(initialized)return;initialized=true;let data=null;try{data=sdk()?.IN_PLAYABLES_ENV?await sdk().game.loadData():JSON.parse(localStorage.getItem('lantern_paths_save')||'null')}catch(e){console.warn('Save unavailable',e)}const n=Number.isInteger(data?.level)&&data.level>=0&&data.level<paths.length?data.level:0;loadLevel(n,data);invoke('system.onPause',()=>{paused=true;draw()});invoke('system.onResume',()=>{paused=false;draw()});invoke('system.isAudioEnabled');invoke('system.onAudioEnabledChange',()=>{});invoke('game.gameReady')}init();})();
</script></body></html>
